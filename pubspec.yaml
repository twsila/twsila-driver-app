name: taxi_for_you
description: Twsila Driver mobile application.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
#to generate auto impl code for model and api requests : flutter packages pub run build_runner build --delete-conflicting-outputs
#BUILDING APK COMMANDS
#flutter build apk --obfuscate --split-debug-info=driver/lib/main.dart
#flutter build apk --no-tree-shake-icons
#to generate build per flavour
#flutter build apk --flavor development -t lib/main_development.dart --release
#flutter build apk --flavor development -t lib/main_production.dart --release
#flutter build apk --flavor development -t lib/main_staging.dart --release
#flutter run --flavor development -t lib/main_development.dart
version: 1.1.1+12

environment:
  sdk: ">=3.0.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.4.0
  retrofit: ^4.10.0
  analyzer: ^10.2.0
  dio: ^5.11.1
  json_serializable: ^6.15.2
  dartz: ^0.10.1
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0
  internet_connection_checker: ^3.0.1
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.6
  freezed: ^3.2.5
  get_it: ^9.3.0
  image_picker: ^1.2.4
  rxdart: ^0.28.0
  carousel_slider: ^5.1.2
  flutter_image_compress: ^2.5.1
  location_geocoder: ^1.0.5
  easy_localization: ^3.0.2
  flutter_phoenix: ^1.1.0
  #  flutter_geocoder: ^0.2.2-nullsafety
  google_maps_flutter: ^2.18.1
  google_places_flutter: ^2.1.1
  flutter_polyline_points: ^3.1.0
  geolocator: ^14.1.2
  fluttertoast: ^10.0.2
  intl_phone_field: ^3.1.0
  pinput: ^7.0.0
  firebase_auth: ^7.1.0
  flutter_bloc: ^9.1.1
  provider: ^6.1.5+1
  equatable: ^2.1.0
  sms_autofill: ^2.5.0
  flutter_spinkit: ^5.2.2
  animated_text_kit: ^4.3.0
  virtual_keyboard_multi_language: ^1.0.3
  awesome_dialog: ^3.3.0

  firebase_core_platform_interface: ^8.2.0
  firebase_messaging: ^17.1.0
  firebase_core: ^5.2.0

  package_info_plus: ^10.2.2

  flutter_staggered_grid_view: ^0.7.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.13.1
  path: ^1.8.2
  im_stepper: ^1.0.1+1
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  share_plus: ^13.3.1
  pdf: ^3.13.1
  location: ^10.2.0
  #  flutter_compass: ^0.6.0
  flutter_rating_bar: ^4.0.1
  expandable_bottom_sheet: ^1.1.1+1
  flutter_animarker: ^3.2.0
  dio_smart_retry: ^7.0.1
  flutter_verification_code: ^1.1.7
  # v10 rewrote the API (MaterialPinField); keep v8 until OTP UI is migrated.
  pin_code_fields: ^8.0.1
  double_back_to_close_app: ^2.1.0
  custom_radio_grouped_button: ^2.3.0
  full_screen_image: ^2.0.0
  moyasar: ^3.0.6
  intl: ^0.20.2
  get: ^4.7.3
  just_audio: ^0.10.6
  meta: ^1.18.0
  bloc: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  retrofit_generator: ^10.3.3
  build_runner: ^2.15.1
  change_app_package_name: ^1.5.0
  flutter_flavorizr: ^2.6.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.jpeg"
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
#  flutter_lints: ^1.8.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  uses-material-design: true
  assets:
    - assets/localization/
    - assets/drawable/
    - assets/fonts/arabic/
    - assets/fonts/english/
    - assets/images/
    - assets/json/
    - assets/sound/

  fonts:
    - family: cairo
      fonts:
        - asset: assets/fonts/arabic/Cairo-Bold.ttf
        - asset: assets/fonts/arabic/Cairo-ExtraBold.ttf
        - asset: assets/fonts/arabic/Cairo-Light.ttf
        - asset: assets/fonts/arabic/Cairo-Regular.ttf
        - asset: assets/fonts/arabic/Cairo-SemiBold.ttf
        - asset: assets/fonts/arabic/Cairo-Medium.ttf
        - asset: assets/fonts/arabic/Cairo-ExtraLight.ttf
        - asset: assets/fonts/arabic/Cairo-Black.ttf
    - family: lato
      fonts:
        - asset: assets/fonts/english/Lato-Bold.ttf
        - asset: assets/fonts/english/Lato-Black.ttf
        - asset: assets/fonts/english/Lato-Light.ttf
        - asset: assets/fonts/english/Lato-Regular.ttf
    - family: SaudiRiyal
      fonts:
        - asset: assets/fonts/saudi_riyal/saudi_riyal.ttf
        - asset: assets/fonts/saudi_riyal/saudi_riyal_bold.ttf
          weight: 700
